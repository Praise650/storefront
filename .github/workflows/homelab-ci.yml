name: homelab-ci

on:
  pull_request:
    branches: [homelab]
  push:
    branches: [homelab]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/saleor-storefront

jobs:
  verify:
    name: Lint, type-check, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    env:
      NEXT_PUBLIC_SALEOR_API_URL: ${{ vars.SALEOR_API_URL }}
      NEXT_PUBLIC_STOREFRONT_URL: ${{ vars.STOREFRONT_URL }}
      NEXT_PUBLIC_DEFAULT_CHANNEL: ${{ vars.DEFAULT_CHANNEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4                 # pnpm version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate GraphQL types        # <-- the new step
        run: pnpm run generate:all
      - name: Lint
        run: pnpm run --if-present lint
      - name: Type-check
        run: pnpm exec tsc --noEmit
      - name: Unit tests
        run: pnpm run --if-present test

  image:
    name: Build image (push on homelab only)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev                                # pulls in the dev variables (and its branch rules)
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Check the API is reachable (the build prerenders against it)
        run: |
          curl -sf -m 15 "${{ vars.SALEOR_API_URL }}" \
            -H 'Content-Type: application/json' \
            -d '{"query":"{ shop { name } }"}' | grep -q '"shop"'

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=dev-
            type=raw,value=dev

      - name: Build (and push on homelab)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SALEOR_API_URL=${{ vars.SALEOR_API_URL }}
            NEXT_PUBLIC_STOREFRONT_URL=${{ vars.STOREFRONT_URL }}
            NEXT_PUBLIC_DEFAULT_CHANNEL=${{ vars.DEFAULT_CHANNEL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
